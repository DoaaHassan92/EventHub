name: Playwright Tests

# When the tests run
on:
  push:
    branches: [main]        # after code lands on main
  pull_request:
    branches: [main]        # before code is merged into main
  workflow_dispatch:        # manually, from the GitHub Actions tab

# If a newer run starts for the same branch, cancel the older one
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Same image as local runs: Node, Chromium and npm packages come from the Dockerfile
      - name: Build test image
        run: docker build -t eventhub-tests .

      # The report is written to /output/playwright-report, mounted to the workspace.
      # A failing test makes the container exit non-zero, which turns the run red.
      - name: Run Playwright tests
        run: >
          docker run --rm -e CI=true
          -v "${{ github.workspace }}:/output"
          eventhub-tests npx playwright test --reporter=html,line

      # always() uploads the report even when tests fail, which is when you need it
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
